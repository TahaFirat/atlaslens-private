name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.10"
  NODE_VERSION: "24.12.0"
  UV_VERSION: "0.11.7"
  OPENAI_API_KEY: ""
  OCR_ENABLED: "false"

jobs:
  backend:
    name: Backend lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm run test
      - name: Production build
        run: npm run build

  contract:
    name: OpenAPI and generated type drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked validator dependencies
        run: npm --prefix apps/web ci --no-audit --no-fund
      - name: Parse OpenAPI 3.1 contract
        run: bash scripts/validate-contract.sh
      - name: Check generated frontend types
        working-directory: apps/web
        run: npm run check:api

  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      POSTGRES_PASSWORD: compose-validation-only
    steps:
      - uses: actions/checkout@v4
      - name: Validate root Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
