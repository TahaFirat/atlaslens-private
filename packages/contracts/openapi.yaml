openapi: 3.1.0
info:
  title: AtlasLens API
  version: 0.1.0
  description: Privacy-conscious image analysis and Phase 2 case/evidence investigation API.
servers:
- url: http://127.0.0.1:8000
tags:
- name: system
- name: analyses
- name: cases
  description: Local single-workspace case and evidence workflow; production tenancy is not claimed.
- name: evaluation
- name: dataset-qa
- name: operators
- name: mapillary-private-demo
  description: Disabled-by-default, localhost-only attributed Mapillary pilot retrieval.
paths:
  /api/v1/health:
    get:
      tags:
      - system
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/ready:
    get:
      tags:
      - system
      operationId: getReadiness
      summary: Required local dependency readiness
      responses:
        '200':
          description: Required local dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: A required local dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/capabilities:
    get:
      tags:
      - system
      operationId: getCapabilities
      summary: Discover safe runtime capabilities
      responses:
        '200':
          description: Current capability state; optional providers may be unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /api/v1/providers:
    get:
      tags:
      - system
      operationId: listProviders
      summary: List safe provider and deployment status
      responses:
        '200':
          description: Provider status without secrets or local paths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderStatusResponse'
  /api/v1/models:
    get:
      tags:
      - operators
      operationId: listModels
      summary: List safe registered model status
      responses:
        '200':
          description: Safe model registry status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelStatusResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/analyses:
    get:
      tags:
      - analyses
      operationId: listAnalyses
      summary: List privacy-bounded analysis history
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: status
        schema:
          $ref: '#/components/schemas/AnalysisStatus'
      - in: query
        name: classification
        schema:
          type: string
          enum:
          - real
          - simulated
      - in: query
        name: provider
        schema:
          type: string
          maxLength: 80
      - in: query
        name: search
        schema:
          type: string
          maxLength: 120
      - in: query
        name: created_from
        schema:
          type: string
          format: date-time
      - in: query
        name: created_to
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Current TTL-bound history summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisHistoryPage'
        '422':
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags:
      - analyses
      operationId: createAnalysis
      summary: Create an asynchronous image analysis
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          minLength: 8
          maxLength: 128
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - image
              - analysis_mode
              - cloud_processing_consent
              - authorization_acknowledged
              properties:
                image:
                  type: string
                  format: binary
                analysis_mode:
                  $ref: '#/components/schemas/AnalysisMode'
                cloud_processing_consent:
                  type: boolean
                authorization_acknowledged:
                  type: boolean
                allow_cloud_assist:
                  type: boolean
                  default: false
      responses:
        '202':
          description: Analysis accepted.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '413':
          $ref: '#/components/responses/ProblemResponse'
        '415':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/analyses/{analysis_id}/rerun:
    parameters:
    - $ref: '#/components/parameters/AnalysisId'
    post:
      tags:
      - analyses
      operationId: rerunAnalysis
      summary: Rerun only when the original source was explicitly retained
      responses:
        '202':
          description: Rerun accepted as a new analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/analyses/{analysis_id}:
    parameters:
    - $ref: '#/components/parameters/AnalysisId'
    get:
      tags:
      - analyses
      operationId: getAnalysis
      summary: Get current or terminal analysis state
      responses:
        '200':
          description: Current analysis state.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '404':
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags:
      - analyses
      operationId: deleteAnalysis
      summary: Delete or cancel an analysis
      responses:
        '200':
          description: Deletion is idempotently acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/analyses/{analysis_id}/events:
    parameters:
    - $ref: '#/components/parameters/AnalysisId'
    get:
      tags:
      - analyses
      operationId: streamAnalysisEvents
      summary: Stream progress, heartbeat, and terminal events
      responses:
        '200':
          description: SSE stream. Event names are progress, heartbeat, completed, failed, and deleted. Each data payload validates as AnalysisEvent.
          headers:
            Cache-Control:
              schema:
                type: string
            X-Accel-Buffering:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
              example: 'event: progress

                data: {"event_id":"1","event_type":"progress","analysis_id":"00000000-0000-4000-8000-000000000000","occurred_at":"2026-07-10T00:00:00Z","status":"processing","progress":{"stage":"quality","percent":60,"message_key":"progress.quality"}}'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/evaluations:
    get:
      tags:
      - evaluation
      operationId: listEvaluations
      summary: List validated benchmark report summaries
      responses:
        '200':
          description: Available evaluation reports; simulated providers are excluded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationReportList'
        '404':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/evaluations/{report_id}:
    parameters:
    - in: path
      name: report_id
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_.-]+$
        maxLength: 120
    get:
      tags:
      - evaluation
      operationId: getEvaluation
      summary: Get one validated benchmark report summary
      responses:
        '200':
          description: Safe evaluation report summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationReportSummary'
        '404':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/datasets/qa:
    get:
      tags:
      - dataset-qa
      operationId: listDatasetQaReports
      summary: List prebuilt safe dataset-QA reports
      responses:
        '200':
          description: Safe dataset-QA report summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetQAReportList'
        '404':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/datasets/qa/{report_id}:
    parameters:
    - in: path
      name: report_id
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_.-]+$
        maxLength: 120
    get:
      tags:
      - dataset-qa
      operationId: getDatasetQaReport
      summary: Get one prebuilt safe dataset-QA report
      responses:
        '200':
          description: Structured QA issues without source paths or exact GPS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetQAReport'
        '404':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/system-intelligence:
    get:
      tags: [operators]
      summary: Safe model and reference-index runtime inventory
      operationId: getSystemIntelligence
      responses:
        '200':
          description: Aggregate operator-only model, pipeline, leakage-audit, and reference-index status without paths or secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemIntelligenceResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/mapillary-demo/status:
    get:
      tags:
      - mapillary-private-demo
      operationId: getMapillaryDemoStatus
      summary: Get private Mapillary demo readiness
      responses:
        '200':
          description: Credential-free disabled, not-ready, or active demo state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapillaryDemoStatusResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/mapillary-demo/query:
    post:
      tags:
      - mapillary-private-demo
      operationId: queryMapillaryDemo
      summary: Query the private attributed Mapillary demo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_queryMapillaryDemo'
      responses:
        '200':
          description: Attributed uncalibrated candidates or an explicit abstention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapillaryDemoQueryResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '413':
          $ref: '#/components/responses/ProblemResponse'
        '415':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/cases:
    post:
      tags:
      - cases
      summary: Create Case
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseView'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
      description: Create a case in the local default workspace seam; this does not
        claim production tenant isolation.
    get:
      tags:
      - cases
      summary: List Cases
      operationId: listCases
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePage'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/cases/{case_id}:
    get:
      tags:
      - cases
      summary: Get Case
      operationId: getCase
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseView'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags:
      - cases
      summary: Patch Case
      operationId: patchCase
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasePatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseView'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/cases/{case_id}/media:
    post:
      tags:
      - cases
      summary: Create Case Media
      operationId: createCaseMedia
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseMediaCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseMediaView'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
      description: Store sanitized image metadata only. Image bytes must use the existing
        POST /api/v1/analyses workflow.
    get:
      tags:
      - cases
      summary: List Case Media
      operationId: listCaseMedia
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseMediaPage'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/cases/{case_id}/analyses/{analysis_id}/link:
    post:
      tags:
      - cases
      summary: Link Analysis
      operationId: linkCaseAnalysis
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Analysis Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisLinkRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseMediaView'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
      description: Idempotently link one existing analysis to explicitly identified
        case media after fail-closed relationship checks.
  /api/v1/cases/{case_id}/analyses/{analysis_id}/materialize-evidence:
    post:
      tags:
      - cases
      summary: Materialize Evidence
      operationId: materializeCaseEvidence
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Analysis Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterializeEvidenceRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterializationView'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
      description: Idempotently normalize retained analysis metadata into immutable
        evidence and hypotheses; no image pixels are stored here.
  /api/v1/cases/{case_id}/evidence:
    get:
      tags:
      - cases
      summary: List Evidence
      operationId: listCaseEvidence
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      - name: media_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Media Id
      - name: analysis_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Analysis Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidencePage'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
      description: List immutable normalized evidence in stable creation order. Retrieval
        evidence is not a confirmed location.
  /api/v1/cases/{case_id}/hypotheses:
    get:
      tags:
      - cases
      summary: List Hypotheses
      operationId: listCaseHypotheses
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      - name: media_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Media Id
      - name: analysis_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Analysis Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HypothesisPage'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
      description: List model, imported, and separate operator hypotheses without manufacturing
        probability values.
  /api/v1/cases/{case_id}/hypotheses/{hypothesis_id}/adjudications:
    post:
      tags:
      - cases
      summary: Add Adjudication
      operationId: createHypothesisAdjudication
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      - name: hypothesis_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Hypothesis Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjudicationCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjudicationView'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
      description: Append an analyst decision; prior adjudications are never updated
        or deleted.
  /api/v1/cases/{case_id}/operator-hypotheses:
    post:
      tags:
      - cases
      summary: Add Operator Hypothesis
      operationId: createOperatorHypothesis
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorHypothesisCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorCorrectionView'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
      description: Create a separate operator-origin hypothesis and initial adjudication
        without overwriting model output.
  /api/v1/cases/{case_id}/audit-events:
    get:
      tags:
      - cases
      summary: List Audit Events
      operationId: listCaseAuditEvents
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
      description: List append-only, hash-chained application history in monotonic sequence
        order.
  /api/v1/cases/{case_id}/audit-integrity:
    get:
      tags:
      - cases
      summary: Get Audit Integrity
      operationId: getCaseAuditIntegrity
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditIntegrityView'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
      description: Verify tamper-evident application history. This is not legally certified
        evidence.
