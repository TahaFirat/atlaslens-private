[project]
name = "atlaslens-api"
version = "0.1.0"
description = "Privacy-conscious AtlasLens Phase 1 analysis API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "faiss-cpu==1.14.3",
  "fastapi==0.116.1",
  "geoclip==1.2.0",
  "huggingface-hub==0.33.4",
  "httpx==0.28.1",
  "numpy==2.2.6",
  "openai==1.97.1",
  "opencv-python-headless==4.12.0.88",
  "onnxruntime==1.27.0",
  "pillow==11.3.0",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "rapidocr==3.9.1",
  "sqlalchemy==2.0.41",
  "safetensors==0.5.3",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "transformers==4.53.2",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
atlas = "atlaslens_api.cli:main"
atlaslens-corpus = "atlaslens_api.corpus_cli:main"

[dependency-groups]
dev = [
  "mypy==1.17.0",
  "piexif==1.1.3",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlaslens_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings --basetemp=.pytest-tmp -p no:cacheprovider"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG"]
"alembic/**" = ["INP001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["cv2.*", "faiss.*", "geoclip.*", "piexif.*", "torch.*", "transformers.*", "yaml.*"]
ignore_missing_imports = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
